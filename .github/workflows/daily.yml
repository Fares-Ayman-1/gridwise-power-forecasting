name: Daily forecast

# Runs before the 12:00 (Europe/Berlin) day-ahead auction. 06:30 UTC is 07:30 in winter and 08:30 in
# summer, which leaves hours of margin for a late runner. The job scores the forecasts whose prices have
# been published since, forecasts tomorrow, and commits docs/live. The commit time is the public proof
# that each forecast existed before its prices did.
on:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Restore downloaded data and cached past forecasts
        uses: actions/cache@v4
        with:
          path: data
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Install
        run: uv sync --frozen --no-dev --extra nn
      - name: Score past days, forecast tomorrow
        run: uv run python -m gridwise.live run
      - name: Commit the live record
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/live
          if git diff --cached --quiet; then
            echo "nothing new to commit"
          else
            git commit -m "Live record: $(date -u +%Y-%m-%d)"
            git push
          fi
