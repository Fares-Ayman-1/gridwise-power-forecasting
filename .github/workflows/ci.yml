name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/live/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (synthetic market data; nothing is downloaded in CI)
        run: uv run pytest
        env:
          MLFLOW_DISABLE_AGENT_HINT: "1"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -t gridwise:ci .
      - name: Start it and call the health check
        run: |
          docker run -d --name gridwise -p 8000:8000 gridwise:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/health && exit 0; sleep 2; done
          docker logs gridwise; exit 1
